version: '3.8'

services:
  gridguard-api:
    build: .
    container_name: gridguard_api
    ports:
      - "8000:8000"
    command: python -m api.main
    restart: always

  gridguard-dashboard:
    build: .
    container_name: gridguard_dashboard
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - gridguard-api
    restart: always
